name: Build geoip files
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 4"
  push:
    branches:
      - master
    paths-ignore:
      - "assets/*"
      - ".gitignore"
      - "LICENSE*"
      - "*.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "assets/*"
      - ".gitignore"
      - "LICENSE*"
      - "*.md"
permissions:
  contents: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
          cache-dependency-path: ./go.sum

      - name: Set variables
        run: |
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "YEAR=$(date +%Y)" >> $GITHUB_ENV
          echo "MONTH=$(date +%m)" >> $GITHUB_ENV
        shell: bash

      # ----- 1. 下载 MaxMind 全部数据（Country + ASN）-----
      - name: Download GeoLite2 databases
        env:
          LICENSE_KEY: ${{ secrets.MAXMIND_GEOLITE2_LICENSE }}
        run: |
          mkdir -p output
          curl -L "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-ASN&license_key=${LICENSE_KEY}&suffix=tar.gz" -o ./output/GeoLite2-ASN.tar.gz
          curl -L "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-ASN-CSV&license_key=${LICENSE_KEY}&suffix=zip" -o ./output/GeoLite2-ASN-CSV.zip
          curl -L "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country&license_key=${LICENSE_KEY}&suffix=tar.gz" -o ./output/GeoLite2-Country.tar.gz
          curl -L "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country-CSV&license_key=${LICENSE_KEY}&suffix=zip" -o ./output/GeoLite2-Country-CSV.zip

      # ----- 2. 下载 DB-IP Country Lite MMDB（作为补充）-----
      - name: Download DB-IP Country Lite database
        run: |
          mkdir -p db-ip
          curl -L -o db-ip/dbip-country-lite.mmdb.gz "https://download.db-ip.com/free/dbip-country-lite-${{ env.YEAR }}-${{ env.MONTH }}.mmdb.gz"
          gzip -d db-ip/dbip-country-lite.mmdb.gz

      # ----- 3. 解压并准备所有数据 -----
      - name: Prepare databases
        run: |
          cp ./output/*.{gz,zip} ./
          unzip GeoLite2-Country-CSV.zip
          unzip GeoLite2-ASN-CSV.zip
          tar -xvzf GeoLite2-Country.tar.gz
          tar -xvzf GeoLite2-ASN.tar.gz

          # 复制 MaxMind MMDB 到 output（用于后续 maxmindMMDB 输出）
          cp GeoLite2-Country_*/*.mmdb ./output/
          cp GeoLite2-ASN_*/*.mmdb ./output/

          # 复制 MaxMind CSV 到 geolite2（供 ASN 和 Country 输入使用）
          mkdir -p geolite2
          cp GeoLite2-Country-CSV_*/{GeoLite2-Country-Blocks-*,GeoLite2-Country-Locations-en,GeoLite2-Country-Locations-zh-CN}.csv ./geolite2/
          cp GeoLite2-ASN-CSV_*/*.csv ./geolite2/

      # ----- 4. 修改 config.json：同时保留两个国家数据源，并控制顺序 -----
      - name: Update config.json for dual sources (DB-IP first, MaxMind second)
        run: |
          # 在 input 数组开头插入 dbipCountryMMDB 条目
          jq '.input = [{"type": "dbipCountryMMDB", "action": "add", "args": {"uri": "./db-ip/dbip-country-lite.mmdb"}}] + .input' config.json > config.tmp.json
          mv config.tmp.json config.json
          # 注意：原有的 maxmindGeoLite2CountryCSV 依然存在，且位于 dbip 之后，优先级更高

      # ----- 5. 清理 ChinaMax_IP.txt（不变）-----
      - name: Clean ChinaMax_IP.txt
        run: |
          curl -sSL https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_IP.txt \
            | grep -v '^#' \
            | grep -v '^DOMAIN:' \
            | grep -v '^IP-ASN:' \
            | grep -v '^TOTAL:' \
            | grep -v '^PROCESS-NAME:' \
            | grep -v '^IP-CIDR:' \
            | grep -v '^IP-CIDR6:' \
            | grep -v '^[[:space:]]*$' \
            | sed -E 's/^IP-CIDR,//; s/^IP-CIDR6,//' \
            | grep -v '^[0-9]\+$' \
            | grep -v '::ffff:' \
            > china_clean.txt

      # ----- 6. 构建 GeoIP 文件（不变）-----
      - name: Build geoip files
        run: |
          go build ./
          ./geoip convert -c ./config.json

      # ----- 7. 验证 MMDB（不变）-----
      - name: Verify mmdb files
        run: |
          cd ./output || exit 1
          go install -v github.com/maxmind/mmdbverify@latest
          for name in $(ls *.mmdb); do
            $(go env GOPATH)/bin/mmdbverify -file ${name}
          done

      # ----- 8. 生成 SHA256（不变）-----
      - name: Generate sha256 checksum for dat files
        run: |
          cd ./output || exit 1
          for name in $(ls *.dat); do
            sha256sum ${name} > ./${name}.sha256sum
          done

      - name: Generate sha256 checksum for mmdb files
        run: |
          cd ./output || exit 1
          for name in $(ls *.mmdb); do
            sha256sum ${name} > ./${name}.sha256sum
          done

      # ----- 9. 推送 release 分支（不变）-----
      - name: Git push assets to "release" branch
        if: github.event_name != 'pull_request'
        run: |
          cd output || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add geoip "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u geoip release

      # ----- 10. 清除 CDN（不变）-----
      - name: Purge jsdelivr CDN
        if: github.event_name != 'pull_request'
        run: |
          cd output || exit 1
          for file in $(ls); do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}"
          done

      # ----- 11. 清理中间文件（保留最终产物）-----
      - name: Remove some files to avoid publishing to GitHub release
        if: github.event_name != 'pull_request'
        run: |
          rm -rf ./output/*.{gz,zip}
          rm -rf ./output/GeoLite2-*.csv
          rm -rf ./output/GeoLite2-*.mmdb
          rm -rf ./output/GeoLite2-*.sha256sum
          rm -rf ./output/{clash,dat,mrs,nginx,srs,surge,text}
          rm -rf ./db-ip   # 清理 DB-IP 原始文件

      # ----- 12. 创建 Release（不变）-----
      - name: Upload files to GitHub release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.TAG_NAME }} --title "${{ env.RELEASE_NAME }}" ./output/*
